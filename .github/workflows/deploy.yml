name: CI/CD Pipeline

on:
  push:
    branches:
      - master

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v2
      with:
        node-version: 20 # Adjust as needed

    - name: Install server dependencies
      run: npm --prefix server i

    - name: Install client dependencies
      run: npm --prefix client i

    - name: Run tests
      run: npm --prefix server run test
      env:
        API_KEY: ${{ secrets.API_KEY }}
        API_SECRET: ${{ secrets.API_SECRET }}
        ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
        ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        POCKETBASE_URL: ${{ secrets.POCKETBASE_URL }}

    - name: Build server 
      run: npm --prefix server run build

    - name: Build client 
      run: npm --prefix client run build

  deploy:
    runs-on: ubuntu-latest
    needs: test-and-build

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: SSH action
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.LINODE_IP }}
        username: ${{ secrets.LINODE_USERNAME }}
        key: ${{ secrets.LINODE_SSH_KEY }}
        script: |
          cd /home/apmfree78/coinbase-dca
          ./deploy.sh # script to update codebase and relaunch app
